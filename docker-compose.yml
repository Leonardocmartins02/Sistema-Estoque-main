services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplestock
      POSTGRES_PASSWORD: simplestock
      POSTGRES_DB: simplestock
    ports:
      - '5432:5432'
    volumes:
      - simplestock-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simplestock']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simplestock-postgres-data:
