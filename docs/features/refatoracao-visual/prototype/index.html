/* ---------------- Produto ---------------- */
function pageProduct(p){
  if (!p) return `<div class="page"><nav class="crumbs" aria-label="Trilha"><a href="#/produtos">Produtos</a></nav><div class="card state"><span class="big-ic">${ic('search')}</span><h1 class="section-title">Produto não encontrado</h1><p>Ele pode ter sido excluído, ou o link está incompleto.</p><a class="btn secondary" href="#/produtos">${ic('back','sm')}Voltar para Produtos</a></div></div>`;
  const st = statusOf(p);
  const mine = movements.filter(m=>m.productId===p.id);
  const last30 = mine.filter(m=>m.date >= NOW - 30*DAY);
  const ins = last30.filter(m=>m.type==='IN'||m.type==='INITIAL_STOCK'), outs = last30.filter(m=>m.type==='OUT');
  const sumIn = ins.reduce((s,m)=>s+m.quantity,0), sumOut = outs.reduce((s,m)=>s+m.quantity,0);
  const scale = Math.max(p.balance, p.minStock, 1) * 1.4;
  const gap = p.balance - p.minStock;
  const verdict = p.balance===0 ? `Sem saldo · faltam <b>${p.minStock}</b> para o mínimo` : gap<0 ? `Faltam <b>${-gap}</b> un. para o mínimo` : `<b>${gap}</b> un. acima do mínimo`;
  return `<div class="page">
    <nav class="crumbs" aria-label="Trilha"><a href="#/produtos">Produtos</a>${ic('right','xs')}<span aria-current="page">${esc(p.name)}</span></nav>
    <section class="card" style="margin-bottom:16px">
      <div class="p-head">
        <span class="tile" aria-hidden="true">${initials(p.name)}</span>
        <div class="p-meta">
          <div class="p-title"><h1 class="page-title">${esc(p.name)}</h1>${badge(st)}</div>
          <div class="sub"><span>SKU <b class="tnum">${p.sku}</b></span><span>${esc(p.description)}</span></div>
        </div>
        <div class="actions">
          <button class="btn secondary" type="button" data-toast="Editar abre o formulário preenchido com o estado atual (F-06 corrigido na Fase 9).">${ic('edit','sm')}Editar</button>
          <button class="btn primary" type="button" data-open-move data-product="${p.id}">${ic('swap','sm')}Movimentar</button>
          <button class="btn secondary icon-only md" type="button" aria-label="Mais ações" aria-haspopup="menu" data-menu="${p.id}" data-menu-page>${ic('more','sm')}</button>
        </div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="ml">Saldo atual</div>
          <div class="mv-n big">${fmt(p.balance)}<small>un.</small></div>
          <div class="bullet" role="img" aria-label="Saldo ${p.balance} unidades; mínimo ${p.minStock}">
            <span class="fill" style="width:${p.balance/scale*100}%;background:var(--${st==='ok'?'success':st==='attn'?'warning':'danger'}-fill)"></span>
            <span class="min" style="left:${p.minStock/scale*100}%"></span>
            <span class="min-label" style="left:${p.minStock/scale*100}%">mín. ${p.minStock}</span>
          </div>
          <div class="ms">${verdict}</div>
        </div>
        <div class="metric"><div class="ml">Estoque mínimo</div><div class="mv-n">${fmt(p.minStock)}<small>un.</small></div><div class="ms">Abaixo disso o status vira “Estoque baixo”</div></div>
        <div class="metric"><div class="ml">Entradas · 30 dias</div><div class="mv-n" style="${sumIn?'color:var(--success)':''}">${signed(sumIn)}<small>un.</small></div><div class="ms">${ins.length} lançamentos</div></div>
        <div class="metric"><div class="ml">Saídas · 30 dias</div><div class="mv-n" style="${sumOut?'color:var(--danger)':''}">${signed(-sumOut)}<small>un.</small></div><div class="ms">${outs.length} lançamentos</div></div>
      </div>
    </section>
    <section class="card" style="margin-bottom:16px">
      <div class="card-head"><div><h2 class="section-title">Saldo nos últimos 30 dias</h2><div class="caption">Saldo no fim de cada dia</div></div>
        <button class="btn tertiary sm" type="button" data-table-toggle="trend-p">${ic('table','sm')}Ver como tabela</button></div>
      <div class="card-body"><div class="chart" data-chart="area" data-series="${p.id}" data-min="${p.minStock}" id="trend-p"></div></div>
    </section>
    <section class="card region">
      <div class="card-head" style="padding-bottom:14px"><div><h2 class="section-title">Últimas movimentações</h2><div class="caption">${mine.length} no total</div></div>
        <a class="btn tertiary sm" href="#/movimentacoes?produto=${p.id}">Ver no histórico</a></div>
      ${mine.length ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Quando</th><th>Tipo</th><th class="num">Quantidade</th><th class="num">Saldo</th><th>Responsável</th><th>Observação</th></tr></thead>
      <tbody>${mine.slice(0,8).map(m=>`<tr><td class="tnum" style="white-space:nowrap">${rel(m.date)}</td><td>${mtype(m.type)}</td><td class="num">${deltaHtml(delta(m))}</td><td class="num">${flowHtml(m)}</td><td class="caption" style="font-size:13px">${m.user}</td><td class="caption" style="font-size:13px">${esc(m.note||'—')}</td></tr>`).join('')}</tbody></table></div>
      <div class="cards">${mine.slice(0,6).map(m=>`<div class="pcard"><div class="pcard-top">${mtype(m.type)}${deltaHtml(delta(m))}</div><div class="pcard-mid" style="margin:6px 0 0"><span class="caption">${rel(m.date)}</span>${flowHtml(m)}</div></div>`).join('')}</div>`
      : `<div class="state"><span class="big-ic">${ic('history')}</span><h3>Nenhuma movimentação ainda</h3><p>A primeira entrada aparece aqui assim que for registrada.</p></div>`}
    </section>
  </div>`;
}

/* ---------------- Movimentações (histórico) ---------------- */
const HIST = { q:'', product:'', user:'', period:'30', page:1, open:new Set() };
function pageHistory(route){
  const q = new URLSearchParams(route.query);
  const tipo = q.get('tipo')||'';
  HIST.product = byId[q.get('produto')] ? q.get('produto') : '';
  const typeMap = { '':null, entradas:['IN','INITIAL_STOCK'], saidas:['OUT'], ajustes:['ADJUSTMENT'] };
  const since = HIST.period==='hoje' ? startOfDay(NOW).getTime() : NOW - Number(HIST.period)*DAY;
  let base = movements.filter(m => m.date >= since && (!HIST.product || m.productId===HIST.product) && (!HIST.user || m.user===HIST.user));
  if (HIST.q){ const t = HIST.q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); base = base.filter(m => (byId[m.productId].name+' '+byId[m.productId].sku+' '+m.note).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(t)); }
  const tc = k => viewState==='empty' ? 0 : typeMap[k] ? base.filter(m=>typeMap[k].includes(m.type)).length : base.length;
  const list = typeMap[tipo] ? base.filter(m=>typeMap[tipo].includes(m.type)) : base;
  const size = 25, pages = Math.max(1, Math.ceil(list.length/size)); if (HIST.page>pages) HIST.page = pages;
  const rows = list.slice((HIST.page-1)*size, HIST.page*size);
  const inU = list.filter(m=>m.type==='IN'||m.type==='INITIAL_STOCK').reduce((s,m)=>s+m.quantity,0), outU = list.filter(m=>m.type==='OUT').reduce((s,m)=>s+m.quantity,0);
  const periods = [['hoje','Hoje','hoje'],['7','Últimos 7 dias','nos últimos 7 dias'],['30','Últimos 30 dias','nos últimos 30 dias']];
  const histHref = (t, prod) => { const u = new URLSearchParams(); if (t) u.set('tipo', t); if (prod) u.set('produto', prod); const x = u.toString(); return '#/movimentacoes' + (x ? '?'+x : ''); };
  const chips = [];
  if (HIST.product) chips.push(['product', 'Produto: '+byId[HIST.product].name]);
  if (HIST.user) chips.push(['user', 'Responsável: '+HIST.user]);
  if (HIST.q) chips.push(['q', 'Busca: “'+HIST.q+'”']);
  let groups = '', lastDay = null;
  if (viewState==='loading') groups = Array.from({length:7}).map(()=>`<div class="mv" style="cursor:default"><span class="skel"></span><span class="skel"></span><span class="skel" style="width:70%"></span><span class="skel"></span><span class="skel"></span><span class="skel" style="width:60%"></span><span></span></div>`).join('') + '<span class="sr-only" role="status">Carregando movimentações…</span>';
  else if (viewState==='error') groups = `<div class="state err" role="alert"><span class="big-ic">${ic('alert')}</span><h3>Não foi possível carregar o histórico</h3><p>O servidor não respondeu em 8 segundos.</p><button class="btn secondary" type="button" data-st-reset>${ic('retry','sm')}Tentar de novo</button></div>`;
  else if (viewState==='empty') groups = `<div class="state"><span class="big-ic">${ic('history')}</span><h3>Nenhuma movimentação registrada</h3><p>Entradas, saídas e ajustes aparecem aqui, do mais recente para o mais antigo.</p><button class="btn primary" type="button" data-open-move>${ic('plus','sm')}Nova movimentação</button></div>`;
  else if (viewState==='noresult' || !rows.length) groups = `<div class="state"><span class="big-ic">${ic('search')}</span><h3>Nada encontrado com esses filtros</h3><p>Amplie o período ou remova um filtro.</p><button class="btn secondary" type="button" data-hist-clear>Limpar filtros</button></div>`;
  else rows.forEach(m => {
    const dk = startOfDay(m.date).getTime();
    if (dk!==lastDay){ const dayList = list.filter(x=>startOfDay(x.date).getTime()===dk); groups += `<div class="day"><span>${dayLabel(m.date)}</span><span class="tnum">${dayList.length} movimentaç${dayList.length>1?'ões':'ão'}</span></div>`; lastDay = dk; }
    const p = byId[m.productId]; const open = HIST.open.has(m.id);
    groups += `<div class="mv" role="button" tabindex="0" aria-expanded="${open}" aria-controls="d-${m.id}" data-mv="${m.id}">
      <span class="time">${hm(m.date)}</span>${mtype(m.type)}
      <span class="mprod" style="min-width:0"><span class="prod-name" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>${m.note?`<span class="note" style="display:block">${esc(m.note)}</span>`:`<span class="prod-sku">${p.sku}</span>`}</span>
      ${deltaHtml(delta(m))}${flowHtml(m)}<span class="mv-who">${m.user}</span><span class="chev">${ic('down','sm')}</span></div>
      <div class="mv-detail ${open?'open':''}" id="d-${m.id}"><dl class="kv">
        <div><dt>Data e hora</dt><dd>${new Date(m.date).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</dd></div>
        <div><dt>Produto</dt><dd><a class="prod-name" href="#/produtos/${p.id}">${esc(p.name)}</a></dd></div>
        <div><dt>Saldo</dt><dd>${flowHtml(m)} (${signed(delta(m))})</dd></div>
        <div><dt>Responsável</dt><dd>${m.user}</dd></div>
        <div><dt>SKU</dt><dd class="tnum">${p.sku}</dd></div>
        <div style="grid-column:span 3"><dt>Observação</dt><dd>${esc(m.note||'—')}</dd></div></dl></div>`;
  });
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">Movimentações</h1><p class="page-sub">Histórico de todas as entradas, saídas e ajustes, do mais recente para o mais antigo</p></div></div>
    <section class="card region" aria-label="Histórico de movimentações">
      <div class="toolbar"><nav class="tabs" aria-label="Filtrar por tipo">${[['','Todas'],['entradas','Entradas'],['saidas','Saídas'],['ajustes','Ajustes']].map(([k,l])=>`<a href="${histHref(k, HIST.product)}"${k===tipo?' aria-current="true"':''}>${l}<span class="n tnum">${tc(k)}</span></a>`).join('')}</nav></div>
      <div class="filters">
        <div class="search" style="width:auto">${ic('search','sm')}<label class="sr-only" for="hq">Buscar por produto, SKU ou observação</label><input class="input" id="hq" type="search" placeholder="Produto, SKU ou observação" value="${esc(HIST.q)}"></div>
        <label class="sr-only" for="hp">Produto</label><select class="select" id="hp"><option value="">Todos os produtos</option>${[...products].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${HIST.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        <label class="sr-only" for="hu">Responsável</label><select class="select" id="hu"><option value="">Todos os responsáveis</option>${[...new Set(USERS)].map(u=>`<option ${HIST.user===u?'selected':''}>${u}</option>`).join('')}</select>
        <label class="sr-only" for="hd">Período</label><select class="select" id="hd">${periods.map(([k,l])=>`<option value="${k}" ${HIST.period===k?'selected':''}>${l}</option>`).join('')}<option disabled>Personalizado…</option></select>
      </div>
      ${chips.length ? `<div class="chips"><span class="caption" style="color:var(--text-secondary)">Filtros ativos:</span>${chips.map(([k,l])=>`<span class="fchip">${esc(l)}<button type="button" aria-label="Remover filtro ${esc(l)}" data-chip="${k}">${ic('x','xs')}</button></span>`).join('')}<button class="btn tertiary sm" type="button" data-hist-clear>Limpar todos</button></div>` : ''}
      <div class="summary" aria-live="polite" ${viewState==='content'?'':'hidden'}><span><b class="tnum">${fmt(list.length)}</b> movimentaç${list.length===1?'ão':'ões'} ${periods.find(p=>p[0]===HIST.period)[2]}</span><span>Entraram <b class="tnum" style="color:var(--success)">${signed(inU)} un.</b></span><span>Saíram <b class="tnum" style="color:var(--danger)">${signed(-outU)} un.</b></span></div>
      <div>${groups}</div>
      ${rows.length && viewState==='content' ? `<div class="region-foot"><span class="tnum">${fmt((HIST.page-1)*size+1)}–${fmt(Math.min(HIST.page*size,list.length))} de ${fmt(list.length)}</span><div class="pager" role="navigation" aria-label="Paginação do histórico"><button type="button" data-hpage="${HIST.page-1}" ${HIST.page===1?'disabled':''} aria-label="Página anterior">${ic('left','sm')}</button><span class="caption" style="padding:0 8px">Página ${HIST.page} de ${pages}</span><button type="button" data-hpage="${HIST.page+1}" ${HIST.page===pages?'disabled':''} aria-label="Próxima página">${ic('right','sm')}</button></div></div>` : ''}
    </section>
  </div>`;
}

/* ---------------- gráfico de área (SVG próprio — research.md Q3) ---------------- */
function mountCharts(){
  document.querySelectorAll('[data-chart="area"]').forEach(el => {
    const data = series(30, el.dataset.series==='all' ? null : el.dataset.series);
    el._data = data;
    const draw = () => drawArea(el, data, el.dataset.min ? Number(el.dataset.min) : null);
    draw();
    if (window.ResizeObserver){ const ro = new ResizeObserver(draw); ro.observe(el); }
  });
}
// Escala com passo "redondo" (1 · 2 · 2,5 · 5 · 10 × 10ⁿ), no máximo 5 intervalos;
// passo 2,5 só quando o resultado continua inteiro (unidades não são fracionárias).
function niceScale(v){
  v = Math.max(v, 4);
  const p = Math.pow(10, Math.floor(Math.log10(v/5)));
  const step = [1,2,2.5,5,10].map(k=>k*p).filter(st => Number.isInteger(st) || st>=10).find(st => Math.ceil(v/st) <= 5) || 10*p;
  const n = Math.ceil(v/step);
  return { max: n*step, ticks: Array.from({length:n+1}, (_,i)=>i*step) };
}
function drawArea(el, data, min){
  const W = Math.max(280, el.clientWidth), H = 220, padL = 44, padR = 64, padT = 12, axisB = 28;
  const plotW = W - padL - padR, plotH = H - padT - axisB;
  const scale = niceScale(Math.max(...data.map(d=>d.value), min||0) * 1.1), maxV = scale.max;
  const x = i => padL + (data.length===1 ? plotW/2 : i/(data.length-1)*plotW);
  const y = v => padT + plotH - v/maxV*plotH;
  const ticks = scale.ticks;
  const pts = data.map((d,i)=>`${x(i).toFixed(1)},${y(d.value).toFixed(1)}`);
  const line = 'M'+pts.join('L');
  const area = `M${x(0)},${y(0)}L${pts.join('L')}L${x(data.length-1)},${y(0)}Z`;
  const every = plotW < 420 ? 14 : 7;
  const xt = data.map((d,i)=>i).filter(i => (data.length-1-i)%every===0);
  const last = data[data.length-1];
  const label = `Evolução do saldo: de ${fmt(data[0].value)} unidades em ${dShort(data[0].date)} para ${fmt(last.value)} unidades hoje. Use as setas para percorrer os dias.`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" tabindex="0" aria-label="${label}">
    ${ticks.map(t=>`<line class="grid-line" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-text tnum" x="${padL-8}" y="${y(t)+4}" text-anchor="end">${t>=1000?fmt(Math.round(t/100)/10)+' mil':fmt(Math.round(t))}</text>`).join('')}
    ${min!=null ? `<line x1="${padL}" x2="${W-padR}" y1="${y(min)}" y2="${y(min)}" stroke="var(--warning-fill)" stroke-width="1.5"/><text class="axis-text" x="${W-padR+8}" y="${y(min)+4}" style="fill:var(--warning)">mín. ${min}</text>` : ''}
    <path class="series-area" d="${area}"/><path class="series-line" d="${line}"/>
    ${xt.map(i=>`<text class="axis-text" x="${x(i)}" y="${H-8}" text-anchor="middle">${i===data.length-1?'hoje':dShort(data[i].date)}</text>`).join('')}
    <circle class="end-dot" cx="${x(data.length-1)}" cy="${y(last.value)}" r="4.5"/>
    <text class="end-label tnum" x="${x(data.length-1)+10}" y="${y(last.value)+(min!=null && Math.abs(y(last.value)-y(min))<14 ? -10 : 4)}">${fmt(last.value)} un.</text>
    <line class="cross" x1="0" x2="0" y1="${padT}" y2="${padT+plotH}" style="display:none"/>
    <circle class="hover-dot end-dot" r="4.5" style="display:none"/>
    <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>
  <table class="data-table" ${el._table?'':'hidden'}><caption class="sr-only">Saldo no fim de cada dia</caption><thead><tr><th>Dia</th><th class="num">Saldo (un.)</th></tr></thead><tbody>${data.slice().reverse().map(d=>`<tr><td>${dShort(d.date)}</td><td class="num tnum">${fmt(d.value)}</td></tr>`).join('')}</tbody></table>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = svg.querySelector('.cross'), hd = svg.querySelector('.hover-dot');
  const show = i => {
    i = Math.max(0, Math.min(data.length-1, i)); el._i = i;
    const sx = x(i) * (svg.clientWidth / W), sy = y(data[i].value) * (svg.clientHeight / H);
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.display = '';
    hd.setAttribute('cx', x(i)); hd.setAttribute('cy', y(data[i].value)); hd.style.display = '';
    const prev = i>0 ? data[i].value - data[i-1].value : 0;
    tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = fmt(data[i].value)+' un.'; const s = document.createElement('span');
    s.textContent = (i===data.length-1 ? 'hoje' : new Date(data[i].date).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})) + (i>0 ? ' · '+signed(prev)+' no dia' : '');
    tip.append(b, s); tip.style.left = sx+'px'; tip.style.top = (sy-12)+'px'; tip.classList.add('show');
  };
  const hide = () => { cross.style.display='none'; hd.style.display='none'; tip.classList.remove('show'); };
  svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (W / r.width); show(Math.round((px - padL) / plotW * (data.length-1))); });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(el._i ?? data.length-1));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => { if (e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); show((el._i ?? data.length-1) + (e.key==='ArrowLeft'?-1:1)); } if (e.key==='Home') show(0); if (e.key==='End') show(data.length-1); });
}

/* ---------------- menu de ações ---------------- */
const menu = document.getElementById('menu');
let menuFor = null;
function openMenu(btn, pid){
  const p = byId[pid];
  menu.innerHTML = `
    <button role="menuitem" type="button" data-toast="Ajustar estoque: fluxo N2 de hoje (saldo alvo + motivo + resumo), agora no painel lateral.">${ic('adj','sm')}Ajustar estoque</button>
    ${btn.hasAttribute('data-menu-page') ? '' : `<button role="menuitem" type="button" data-go="#/produtos/${pid}">${ic('history','sm')}Ver produto e histórico</button>`}
    <button role="menuitem" type="button" data-toast="Editar: formulário preenchido com o estado atual.">${ic('edit','sm')}Editar</button>
    <hr>
    <button role="menuitem" type="button" class="destr" data-toast="Zerar estoque de ${esc(p.name)}: diálogo N3 dedicado (fluxo existente).">${ic('minus','sm')}Zerar estoque</button>
    <button role="menuitem" type="button" class="destr" data-toast="Excluir ${esc(p.name)}: diálogo N3 avisando que o histórico também é apagado (fluxo existente).">${ic('trash','sm')}Excluir</button>`;
  const r = btn.getBoundingClientRect();
  menu.classList.add('open');
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.right - mw)) + 'px';
  menu.style.top = (r.bottom + mh + 8 > window.innerHeight ? r.top - mh - 6 : r.bottom + 6) + 'px';
  menuFor = btn; btn.setAttribute('aria-expanded','true');
  menu.querySelector('button').focus();
}
function closeMenu(){ if (!menu.classList.contains('open')) return; menu.classList.remove('open'); if (menuFor){ menuFor.setAttribute('aria-expanded','false'); menuFor.focus(); menuFor = null; } }
menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('button')]; const i = items.indexOf(document.activeElement);
  if (e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
  if (e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
  if (e.key==='Escape'){ e.preventDefault(); closeMenu(); }
  if (e.key==='Tab'){ closeMenu(); }
});

/* ---------------- toast ---------------- */
function toast(html){
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span class="ok">${ic('check','sm')}</span><div>${html}</div>`;
  document.getElementById('toasts').append(t);
  setTimeout(()=>t.remove(), 5200);
}

/* ---------------- drawer: Nova movimentação (D3) ---------------- */
const drawer = document.getElementById('drawer'), veil = document.getElementById('veil');
const MV = { type:null, product:null, qty:1, note:'', date:'', opener:null, query:'', active:0 };
function openMove(opener, productId, type){
  Object.assign(MV, { type: type||null, product: productId ? byId[productId] : null, qty:1, note:'', date:'', opener, query:'', active:0 });
  drawer.hidden = false; renderDrawer();
  requestAnimationFrame(()=>{ drawer.classList.add('open'); veil.classList.add('open'); });
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{ const f = drawer.querySelector(MV.type ? (MV.product ? '#mvQty' : '#mvSearch') : '.seg button'); f && f.focus(); }, 40);
}
function closeMove(){
  drawer.classList.remove('open'); veil.classList.remove('open'); document.body.style.overflow = '';
  setTimeout(()=>{ drawer.hidden = true; }, 190);
  if (MV.opener && document.body.contains(MV.opener)) MV.opener.focus();
}
function renderDrawer(focusSel){
  const p = MV.product, t = MV.type;
  const next = p && t ? p.balance + (t==='IN' ? MV.qty : -MV.qty) : null;
  const over = p && t==='OUT' && MV.qty > p.balance;
  const willLow = p && t==='OUT' && !over && next < p.minStock && p.balance >= p.minStock;
  const stAfter = next==null ? null : next===0 ? 'out' : next < p.minStock ? 'attn' : 'ok';
  const title = t==='IN' ? 'Registrar entrada' : t==='OUT' ? 'Registrar saída' : 'Nova movimentação';
  const matches = MV.query ? products.filter(x => (x.name+' '+x.sku).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(MV.query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase())).slice(0,6) : [];
  const ok = p && t && MV.qty>0 && !over;
  drawer.innerHTML = `
    <div class="dr-head"><div><h2 id="drTitle">${title}</h2><p id="drSub">${p ? esc(p.name) : 'Escolha o tipo e o produto'}</p></div>
      <button class="icon-btn" type="button" aria-label="Fechar" data-close-move>${ic('x')}</button></div>
    <div class="dr-body">
      <div class="field"><span class="lbl" id="segL">Tipo de movimentação</span>
        <div class="seg" role="radiogroup" aria-labelledby="segL">
          <button type="button" role="radio" class="in" aria-checked="${t==='IN'}" data-type-set="IN">${ic('in','sm')}Entrada</button>
          <button type="button" role="radio" class="out" aria-checked="${t==='OUT'}" data-type-set="OUT">${ic('out','sm')}Saída</button>
        </div>
        ${t ? '' : `<span class="hint">Nada vem marcado: escolha conscientemente se o estoque vai subir ou descer.</span>`}
      </div>
      <div class="field"><label for="mvSearch">Produto</label>
        ${p ? `<div class="ctx"><span class="nm">${esc(p.name)}</span><button class="change" type="button" data-change-product>Trocar</button>
                <span class="ln tnum">${p.sku}</span><span>${badge(statusOf(p))}</span>
                <span class="ln">Saldo atual <b class="tnum" style="color:var(--text-primary)">${fmt(p.balance)} un.</b> · mínimo ${p.minStock}</span></div>`
            : `<div class="combo"><div class="search" style="width:100%">${ic('search','sm')}<input class="input" id="mvSearch" role="combobox" aria-expanded="${matches.length>0}" aria-controls="mvList" aria-autocomplete="list" ${matches.length?`aria-activedescendant="opt-${MV.active}"`:''} placeholder="Buscar por nome ou SKU" value="${esc(MV.query)}" autocomplete="off"></div>
               ${matches.length ? `<ul class="combo-list" id="mvList" role="listbox" aria-label="Produtos encontrados">${matches.map((x,i)=>`<li role="option" id="opt-${i}" aria-selected="${i===MV.active}" data-pick="${x.id}"><span><span style="font-weight:500">${esc(x.name)}</span><br><span class="prod-sku">${x.sku}</span></span><span class="caption tnum" style="align-self:center">${fmt(x.balance)} un.</span></li>`).join('')}</ul>` : ''}</div>`}
      </div>
      <div class="field"><label for="mvQty">Quantidade</label>
        <div class="stepper"><button type="button" aria-label="Diminuir" data-step="-1">${ic('minus','sm')}</button><input id="mvQty" inputmode="numeric" value="${MV.qty}" aria-describedby="mvPrev"><button type="button" aria-label="Aumentar" data-step="1">${ic('plus','sm')}</button></div>
        <div class="quick">${[1,5,10,25,50].map(n=>`<button type="button" data-qty="${n}" aria-pressed="${String(MV.qty)===String(n)}">${n}</button>`).join('')}</div>
      </div>
      <div id="mvPrev" aria-live="polite">
        ${p && t ? `<div class="preview" style="${over?'border-color:#FECACA;background:var(--danger-subtle)':''}"><div><div class="lbl">Saldo após a operação</div>
            <div class="nums">${fmt(p.balance)}<span class="arrow" aria-hidden="true">→</span><span class="sr-only"> para </span>${over ? '—' : fmt(next)}</div></div>
            <div style="text-align:right">${over ? '' : deltaHtml(next - p.balance)}<div style="margin-top:6px">${over ? '' : badge(stAfter)}</div></div></div>`
          : `<div class="alert info">${ic('swap','sm')}<span>Escolha o tipo e o produto para ver o saldo antes e depois.</span></div>`}
        ${over ? `<div class="alert err" role="alert" style="margin-top:10px">${ic('alert','sm')}<span>A saída de <b>${MV.qty} un.</b> é maior que o saldo disponível (<b>${p.balance} un.</b>). O estoque nunca fica negativo.</span></div>` : ''}
        ${willLow ? `<div class="alert warn" style="margin-top:10px">${ic('alert','sm')}<span>Depois desta saída, <b>${esc(p.name)}</b> fica com estoque baixo (${next} &lt; mínimo ${p.minStock}).</span></div>` : ''}
      </div>
      <div class="field"><label for="mvDate">Data <span class="hint">(opcional — padrão: agora)</span></label><input class="input" id="mvDate" type="datetime-local" value="${MV.date}"></div>
      <div class="field"><label for="mvNote">Observação <span class="hint">(opcional)</span></label><textarea class="input" id="mvNote" rows="3" placeholder="Ex.: nota fiscal, pedido, motivo">${esc(MV.note)}</textarea></div>
    </div>
    <div class="dr-foot"><button class="btn secondary" type="button" data-close-move>Cancelar</button>
      <button class="btn primary" type="button" data-confirm-move ${ok?'':'disabled'}>${t==='OUT' ? 'Confirmar saída' : t==='IN' ? 'Confirmar entrada' : 'Confirmar'}${ok ? ` de ${MV.qty} un.` : ''}</button></div>`;
  if (focusSel){ const f = drawer.querySelector(focusSel); if (f){ f.focus(); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length, f.value.length); } }
}
drawer.addEventListener('click', e => {
  const b = e.target.closest('button,[data-pick]'); if (!b) return;
  if (b.hasAttribute('data-close-move')) return closeMove();
  if (b.dataset.typeSet){ MV.type = b.dataset.typeSet; renderDrawer(`[data-type-set="${MV.type}"]`); }
  if (b.dataset.pick){ MV.product = byId[b.dataset.pick]; MV.query=''; renderDrawer('#mvQty'); }
  if (b.hasAttribute('data-change-product')){ MV.product = null; renderDrawer('#mvSearch'); }
  if (b.dataset.step){ MV.qty = Math.max(1, MV.qty + Number(b.dataset.step)); renderDrawer(`[data-step="${b.dataset.step}"]`); }
  if (b.dataset.qty){ MV.qty = Number(b.dataset.qty); renderDrawer(`[data-qty="${b.dataset.qty}"]`); }
  if (b.hasAttribute('data-confirm-move')){
    const p = MV.product, d = MV.type==='IN' ? MV.qty : -MV.qty, prev = p.balance;
    p.balance += d;
    movements.unshift({ id:'m'+(++mid), productId:p.id, type:MV.type, quantity:MV.qty, date:Date.now(), prev, next:p.balance, user:'admin@simplestock.local', note:MV.note });
    closeMove();
    toast(`${MV.type==='IN'?'Entrada':'Saída'} de <b>${MV.qty} un.</b> em ${esc(p.name)}. Novo saldo: <b>${fmt(p.balance)}</b>. <a href="#/produtos/${p.id}">Ver produto</a>`);
    go();
  }
});
drawer.addEventListener('input', e => {
  if (e.target.id==='mvSearch'){ MV.query = e.target.value; MV.active = 0; renderDrawer('#mvSearch'); }
  if (e.target.id==='mvQty'){ const v = parseInt(e.target.value.replace(/\D/g,''),10); MV.qty = isNaN(v) ? 0 : v; renderDrawer('#mvQty'); }
  if (e.target.id==='mvNote'){ MV.note = e.target.value; }
  if (e.target.id==='mvDate'){ MV.date = e.target.value; }
});
drawer.addEventListener('keydown', e => {
  if (e.key==='Escape'){ e.preventDefault(); return closeMove(); }
  if (e.target.id==='mvSearch'){
    const opts = drawer.querySelectorAll('[data-pick]');
    if (e.key==='ArrowDown' && opts.length){ e.preventDefault(); MV.active = (MV.active+1)%opts.length; renderDrawer('#mvSearch'); }
    if (e.key==='ArrowUp' && opts.length){ e.preventDefault(); MV.active = (MV.active-1+opts.length)%opts.length; renderDrawer('#mvSearch'); }
    if (e.key==='Enter' && opts.length){ e.preventDefault(); MV.product = byId[opts[MV.active].dataset.pick]; MV.query=''; renderDrawer('#mvQty'); }
  }
  if (e.key==='Tab'){ // foco preso, como o Radix Dialog faz no Modal real
    const f = [...drawer.querySelectorAll('button:not([disabled]),input,textarea,select,[tabindex="0"]')];
    if (!f.length) return; const first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
veil.addEventListener('click', () => { if (document.body.classList.contains('nav-open')) toggleNav(false); else closeMove(); });

/* ---------------- ligações da página ---------------- */
function bindPage(route){
  const main = document.getElementById('conteudo');
  const q = main.querySelector('#q');
  if (q) q.addEventListener('input', () => { PAGE.q = q.value; PAGE.page = 1; const pos = q.selectionStart; go(); const n = document.getElementById('q'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } });
  const hq = main.querySelector('#hq');
  if (hq) hq.addEventListener('input', () => { HIST.q = hq.value; HIST.page = 1; const pos = hq.selectionStart; go(); const n = document.getElementById('hq'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } });
  [['hu','user'],['hd','period']].forEach(([id,k]) => { const s = main.querySelector('#'+id); if (s) s.addEventListener('change', () => { HIST[k] = s.value; HIST.page = 1; go(); }); });
  const hp = main.querySelector('#hp'); if (hp) hp.addEventListener('change', () => { HIST.page = 1; const t = new URLSearchParams(parseRoute().query).get('tipo'); history.replaceState(null, '', '#/movimentacoes' + (()=>{ const u = new URLSearchParams(); if (t) u.set('tipo', t); if (hp.value) u.set('produto', hp.value); const x = u.toString(); return x ? '?'+x : ''; })()); go(); document.getElementById('hp').focus(); });
  const size = main.querySelector('[data-size]'); if (size) size.addEventListener('change', () => { PAGE.size = Number(size.value); PAGE.page = 1; go(); });
}
document.addEventListener('click', e => {
  const t = e.target;
  const openBtn = t.closest('[data-open-move]');
  if (openBtn){ e.preventDefault(); return openMove(openBtn, openBtn.dataset.product, openBtn.dataset.type); }
  const mb = t.closest('[data-menu]'); if (mb){ e.stopPropagation(); return menu.classList.contains('open') && menuFor===mb ? closeMenu() : (closeMenu(), openMenu(mb, mb.dataset.menu)); }
  if (menu.classList.contains('open') && !t.closest('#menu')) closeMenu();
  const gb = t.closest('[data-go]'); if (gb){ menu.classList.remove('open'); menuFor=null; location.hash = gb.dataset.go; return; }
  const tb = t.closest('[data-toast]'); if (tb){ if (t.closest('#menu')) closeMenu(); return toast(esc(tb.dataset.toast).replace(/&lt;b&gt;|&lt;\/b&gt;/g,'')); }
  const sb = t.closest('[data-sort]'); if (sb){ const k = sb.dataset.sort; PAGE.dir = PAGE.sort===k && PAGE.dir==='asc' ? 'desc' : 'asc'; PAGE.sort = k; return go(); }
  const pg = t.closest('[data-page]'); if (pg){ PAGE.page = Number(pg.dataset.page); PAGE.sel.clear(); go(); return document.querySelector('.region')?.scrollIntoView({block:'start'}); } // seleção limpa ao paginar (decisão 8 da Fase 4)
  const hp = t.closest('[data-hpage]'); if (hp){ HIST.page = Number(hp.dataset.hpage); return go(); }
  const cb = t.closest('[data-sel]'); if (cb){ cb.checked ? PAGE.sel.add(cb.dataset.sel) : PAGE.sel.delete(cb.dataset.sel); return go(); }
  const all = t.closest('[data-sel-all]'); if (all){ document.querySelectorAll('[data-sel]').forEach(c => all.checked ? PAGE.sel.add(c.dataset.sel) : PAGE.sel.delete(c.dataset.sel)); return go(); }
  if (t.closest('[data-sel-clear]')){ PAGE.sel.clear(); return go(); }
  if (t.closest('[data-clear-search]')){ PAGE.q=''; setState('content'); return; }
  if (t.closest('[data-st-reset]')){ setState('content'); return; }
  if (t.closest('[data-hist-clear]')){ Object.assign(HIST,{q:'',user:'',period:'30',page:1}); history.replaceState(null, '', '#/movimentacoes'); setState('content'); return; }
  const chip = t.closest('[data-chip]'); if (chip){
    if (chip.dataset.chip==='product'){ const tp = new URLSearchParams(parseRoute().query).get('tipo'); history.replaceState(null, '', '#/movimentacoes' + (tp ? '?tipo='+tp : '')); }
    else HIST[chip.dataset.chip] = '';
    return go(); }
  const tt = t.closest('[data-table-toggle]'); if (tt){ const el = document.getElementById(tt.dataset.tableToggle); el._table = !el._table; el.querySelector('.data-table').hidden = !el._table; tt.lastChild.textContent = el._table ? 'Ocultar tabela' : 'Ver como tabela'; return; }
  const mv = t.closest('[data-mv]'); if (mv && !t.closest('a')){ toggleMv(mv); return; }
  const row = t.closest('[data-row]'); if (row && !t.closest('button,a,input')){ location.hash = '#/produtos/'+row.dataset.row; }
});
function toggleMv(mv){ const id = mv.dataset.mv; HIST.open.has(id) ? HIST.open.delete(id) : HIST.open.add(id); const open = HIST.open.has(id); mv.setAttribute('aria-expanded', open); document.getElementById('d-'+id).classList.toggle('open', open); }
document.addEventListener('keydown', e => {
  const mv = e.target.closest && e.target.closest('[data-mv]');
  if (mv && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); toggleMv(mv); }
  if (e.key==='Escape' && document.body.classList.contains('nav-open')) toggleNav(false);
});

/* ---------------- shell: menu no celular e trilho no tablet ---------------- */
function toggleNav(open){ document.body.classList.toggle('nav-open', open); veil.classList.toggle('open', open); document.getElementById('navOpen').setAttribute('aria-expanded', open); if (open) document.querySelector('.nav a').focus(); }
document.getElementById('navOpen').addEventListener('click', () => toggleNav(true));
const mq = window.matchMedia('(min-width:768px) and (max-width:1023px)');
let railPref = null;
function applyRail(){ const rail = railPref ?? mq.matches; document.body.classList.toggle('rail', rail && window.innerWidth >= 768); const b = document.getElementById('railToggle'); b.setAttribute('aria-label', rail ? 'Expandir menu' : 'Recolher menu'); b.title = b.getAttribute('aria-label'); }
mq.addEventListener('change', () => { railPref = null; applyRail(); });
document.getElementById('railToggle').addEventListener('click', () => { railPref = !document.body.classList.contains('rail'); applyRail(); });

/* ---------------- andaimes ---------------- */
function setState(s){ viewState = s; document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.st===s)); go(); }
document.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => setState(b.dataset.st)));
document.querySelectorAll('[data-sb]').forEach(b => b.addEventListener('click', () => { document.body.classList.toggle('sidebar-light', b.dataset.sb==='light'); document.querySelectorAll('[data-sb]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }));
const params = new URLSearchParams(location.search);
if (params.get('sidebar')==='clara') document.querySelector('[data-sb="light"]').click();
if (params.get('estado')) setState(params.get('estado'));
if (params.get('andaimes')==='0') document.querySelector('.scaffold').remove();
if (params.get('rail')==='1') railPref = true;

window.addEventListener('hashchange', () => go(true));
window.addEventListener('resize', applyRail);
applyRail();
go(false);
if (params.get('mov')) { const [pid, type] = params.get('mov').split(':'); openMove(null, pid||null, type||null); }
</script>
</body>
