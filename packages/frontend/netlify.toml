[build]
  base = "."
  command = "pnpm install && pnpm --filter @simplestock/frontend build"
  publish = "dist"

# Substitua a URL abaixo após publicar o backend no Render
# Ex.: https://simplestock-backend.onrender.com
[template.environment]
  VITE_API_BASE = "https://SUA-API-RENDER.aqui"

# Proxy opcional: permite que chamadas para /api/* sejam redirecionadas para a API pública
# ATENÇÃO: o Netlify só aplica isso em produção após o deploy; localmente use VITE_API_BASE
[[redirects]]
  from = "/api/*"
  to = "https://SUA-API-RENDER.aqui/:splat"
  status = 200

# Cabeçalhos de segurança do frontend. `connect-src` precisa listar a URL da
# API publicada (mesma de VITE_API_BASE) — ajuste ao trocar o domínio do Render.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
